name: CI

# Pull-request checks. Pushes to main are checked by deploy.yml (which runs the
# same `npm run check` before building/deploying), so this no longer runs on push
# to avoid a redundant double-run.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  check:
    name: Lint, format & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 22+: html-validate's CLI uses fs.globSync, which doesn't exist on Node 20.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # javascript-obfuscator generates the JS that ships, so its dependency
      # tree is production surface even though it is a devDependency. See the
      # matching step in deploy.yml.
      - name: Audit dependencies
        run: npm run audit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Validate HTML
        run: npm run lint:html

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run tests
        run: npm test

      # Coverage floors, deliberately a SEPARATE step rather than part of
      # `npm run check`: it re-runs the whole suite (~15s) and its thresholds
      # are a ratchet against regression, not a correctness gate — a failure
      # here means "you added runtime code with no test", which is a different
      # conversation from "you broke something".
      #
      # The floors sit just under the current numbers. They are LOW on purpose:
      # coverage used to report 97% because the harness loaded app.js and the
      # chunks as <script> text, which V8 attributes to an anonymous eval, so
      # ~25k lines of runtime code were simply absent from the report. Once
      # test/helpers/boot-page.js switched to vm.runInContext with a real
      # filename, the honest number turned out to be ~50%. Raise these as
      # coverage genuinely improves; do not lower them to make a build pass.
      - name: Coverage floors
        run: npm run test:coverage

      # The obfuscation invariants (reserved names, api-bridge keys surviving
      # the IIFE wrap) are otherwise only checked at deploy time — a PR that
      # breaks one would merge green and fail on main. Build + verify here so
      # the feedback lands before merge.
      - name: Build obfuscated dist
        run: npm run build

      - name: Verify build artifact
        run: npm run verify-build
